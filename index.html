    <style>
                :root {
            --bg-main: #f0f4f9;

    <script>
 
         const GROQ_API_URL = '/api/translate';
		
        const localization = {
            id: {
                title: "RAXS AI",
                newChat: "Obrolan Baru",
                history: "Riwayat",
                welcome: "Halo! Saya asisten AI berbasis Groq. Ada yang bisa saya bantu hari ini?",
                placeholder: "Tanya sesuatu pada Groq..."
            },
            en: {
                title: "RAXS AI",
                newChat: "New Chat",
                history: "History",
                welcome: "Hello! I'm a Groq-powered AI assistant. How can I help you today?",
                placeholder: "Ask Groq something..."
            }

        };
        const randomGreetings = {
    id: [
        "Apa yang ingin Anda tanyakan hari ini?",
        "Ada ide atau topik menarik yang ingin dibahas?",
        "Apa yang ingin Anda pelajari atau buat hari ini?",
        "Ada masalah yang bisa saya bantu selesaikan?"
    ],
    en: [
        "What would you like to ask today?",
        "Have an interesting idea to discuss?",
        "What would you like to learn or build today?",
        "Is there a problem I can help you solve?"
    ]
};

function showWelcomeScreen() {
    const greetingsList = randomGreetings[currentLang] || randomGreetings.id;
    const randomIndex = Math.floor(Math.random() * greetingsList.length);
    const selectedGreeting = greetingsList[randomIndex];

    chatView.innerHTML = `
        <div class="welcome-screen" id="welcome-screen">
            <span class="material-icons-outlined welcome-icon">auto_awesome</span>
            <h2 class="welcome-title">${selectedGreeting}</h2>
        </div>
    `;
}

        let currentLang = 'id';
        let conversations = JSON.parse(localStorage.getItem('chat_history')) || [];
        let activeChatId = localStorage.getItem('active_chat_id') || null;

        const chatView = document.getElementById('chat-view');
        const userInput = document.getElementById('user-input');
        const sidebar = document.getElementById('sidebar');

        function initApp() {
            renderHistoryList();
            if (activeChatId && conversations.find(c => c.id === activeChatId)) {
                loadChat(activeChatId);
            } else {
                startNewChat();
            }
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

   function startNewChat() {
    activeChatId = 'chat_' + Date.now();
    localStorage.setItem('active_chat_id', activeChatId);
    
    // Panggil fungsi sambutan baru
    showWelcomeScreen();
    
    renderHistoryList();
    sidebar.classList.remove('open');
}


        function saveMessageToHistory(text, sender) {
    // 1. Cari apakah ada obrolan yang sedang aktif
    let chat = conversations.find(c => c.id === activeChatId);

    // 2. JIKA BELUM ADA (misal baru buka web), BIKIN OBROLAN BARU OTOMATIS!
    if (!chat) {
        const newChatId = Date.now().toString();
        chat = { id: newChatId, title: "Obrolan Baru", messages: [] };
        conversations.push(chat);
        activeChatId = newChatId;
        localStorage.setItem('active_chat_id', activeChatId);
    }

    // 3. Ringkas jika ada gambar Base64 agar localStorage tidak jebol (Bug C)
    let cleanText = text;
    if (text.includes('data:image/') || text.includes('<img')) {
        cleanText = '📷 [Gambar disematkan]';
    }

    // 3.5 Set judul obrolan otomatis dari pesan pertama milik user (kalau masih judul default)
    if (sender === 'user' && (chat.title === "Obrolan Baru" || chat.title === "New Chat")) {
        const titleSource = cleanText.replace(/\s+/g, ' ').trim();
        if (titleSource === '📷 [Gambar disematkan]') {
            chat.title = '📷 Obrolan dengan Gambar';
        } else if (titleSource.length > 0) {
            chat.title = titleSource.length > 32 ? titleSource.substring(0, 32) + '…' : titleSource;
        }
    }

    // 4. Masukkan pesan ke dalam array riwayat obrolan
    chat.messages.push({ sender, text: cleanText });

    // 5. Simpan secara permanen ke memori browser
    try {
        // Sesuaikan nama key 'raxs_conversations' dengan yang kamu pakai di kodemu (misal: 'chat_history' dll)
        localStorage.setItem('chat_history', JSON.stringify(conversations));
    } catch (e) {
        console.warn('LocalStorage penuh atau error:', e);
    }

    // 6. Render ulang sidebar HANYA saat judul baru saja di-set (pesan pertama user)
    // — bukan setiap pesan, agar tidak boros re-render
    const isFirstUserMsg = sender === 'user' && chat.messages.length === 1;
    if (isFirstUserMsg && typeof renderHistoryList === 'function') {
        renderHistoryList();
    }
}


        function renderHistoryList() {
            const listContainer = document.getElementById('history-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            conversations.forEach(chat => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                if (chat.id === activeChatId) item.classList.add('active');
                
                item.addEventListener('click', () => {
                    loadChat(chat.id);
                });

                item.innerHTML = `
                    <div class="item-text">
                        <span class="material-icons-outlined" style="font-size: 18px;">chat_bubble_outline</span>
                        <span>${chat.title}</span>
                    </div>
                    <button class="delete-hist-btn" title="Hapus Obrolan">
                        <span class="material-icons-outlined" style="font-size: 18px;">delete</span>
                    </button>
                `;

                const deleteBtn = item.querySelector('.delete-hist-btn');
                deleteBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    deleteChat(chat.id);
                });

                listContainer.appendChild(item);
            });
        }

function loadChat(id) {
    activeChatId = id;
    localStorage.setItem('active_chat_id', id);
    renderHistoryList();

    const chat = conversations.find(c => c.id === id);
    chatView.innerHTML = '';
    
    if (chat && chat.messages) {
        chat.messages.forEach(msg => {
            // Render semua pesan sebagai teks/Markdown (gambar disimpan sebagai teks placeholder)
            appendMessage(msg.text, msg.sender, false);
        });
        chatView.scrollTop = chatView.scrollHeight;
    }
    sidebar.classList.remove('open');
}


        function deleteChat(id) {
            conversations = conversations.filter(c => c.id !== id);
            localStorage.setItem('chat_history', JSON.stringify(conversations));
            
            if (activeChatId === id) {
                activeChatId = null;
                startNewChat();
            } else {
                renderHistoryList();
            }
        }
// Variable untuk menyimpan memori foto terakhir

// --- FUNGSI APPEND MESSAGE (VERSI BERSIH & MENGGUNAKAN MARKED.JS) ---[span_3](start_span)[span_3](end_span)
function appendMessage(text, sender, shouldSave = true) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    
    // TAMBAHKAN BARIS INI:
    msgDiv.dataset.raw = text; 
    const avatarHTML = sender === 'user' 
    ? '<div class="avatar"><span class="material-icons-outlined">person</span></div>'
    : '<div class="avatar"><span class="material-icons-outlined">auto_awesome</span></div>';


    let formattedContent = text;

    if (sender === 'bot') {
        // Menggunakan marked.js untuk merender Markdown secara presisi & profesional[span_4](start_span)[span_4](end_span)
        formattedContent = typeof marked !== 'undefined' ? marked.parse(text) : text;
    }

    // --- FITUR TOMBOL SALIN KHUSUS UNTUK BOT ---[span_5](start_span)[span_5](end_span)
    let copyButtonHTML = '';
    if (sender === 'bot') {
        const safeText = encodeURIComponent(text);
        copyButtonHTML = `
            <button class="copy-btn" onclick="copyMessageText(this, '${safeText}')" title="Salin Teks">
                <span class="material-icons-outlined" style="font-size: 12px;">content_copy</span> Salin
            </button>
        `;
    }

    msgDiv.innerHTML = `${avatarHTML}<div class="content">${formattedContent}${copyButtonHTML}</div>`;
    chatView.appendChild(msgDiv);
    chatView.scrollTop = chatView.scrollHeight;

    if (shouldSave) saveMessageToHistory(text, sender);
}

        let selectedModel = "openai/gpt-oss-120b";

        if (hasImage) {

            const questionText = text !== ""

            const userMessageContent = [

                { type: "image_url", image_url: { url: imageToSend } }
            ];

            payloadMessages = [{ role: "user", content: userMessageContent }];
        } else {
            // Obrolan teks biasa menggunakan systemPrompt yang sudah didefinisikan di atas

// 3. KIRIM KE API GROQ
const response = await fetch(GROQ_API_URL, {

});

if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

const data = await response.json();

if (botReply.trim().startsWith("The user")) {

// --- PILIH GAMBAR: HANYA TAMPILKAN PREVIEW, BELUM DIKIRIM ---
function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 1024;
            let width = img.width, height = img.height;

            if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

            // Simpan sebagai gambar yang MENUNGGU dikirim (belum masuk ke chat/API)
            lastUploadedImageBase64 = compressedBase64;

            const previewWrapper = document.getElementById('image-preview-wrapper');
            const previewThumb = document.getElementById('image-preview-thumb');
            previewThumb.src = compressedBase64;
            previewWrapper.classList.add('active');

            // Fokuskan ke input teks agar user bisa langsung menulis pertanyaan
            userInput.focus();
        };
        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
    event.target.value = '';
}

// Variable untuk mencegah klik ganda saat proses penerjemahan berjalan
let isTranslating = false;

async function getTranslation(text, targetLang) {
    const targetCode = targetLang === 'en' ? 'en' : 'id';

    // 1. Jalur Utama: Memanggil Backend Vercel (Aman dari intipan)
    try {
        const response = await fetch('/api/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, targetLang })
        });

        if (response.ok) {
            const data = await response.json();
            const result = data.choices?.[0]?.message?.content?.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
            if (result) return result;
        }
    } catch (err) {
        console.warn("Backend error/limit. Beralih ke Google Translate...", err);
    }

    // 2. Jalur Cadangan (Google Translate)
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetCode}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data[0]) {
            return data[0].map(item => item[0]).join('');
        }
    } catch (err) {
        console.error("Gagal pada Google Translate:", err);
    }

    return text;
}

// Fungsi Utama Tombol Bahasa
async function toggleLanguage() {
    if (isTranslating) return;
    
    currentLang = currentLang === 'id' ? 'en' : 'id';
    const langBtn = document.getElementById('lang-btn');
    if (langBtn) langBtn.innerText = '...';

    // Update UI Statis
    if (typeof localization !== 'undefined') {
        if (document.getElementById('app-title')) document.getElementById('app-title').innerText = localization[currentLang].title;
        if (document.getElementById('btn-new-chat')) document.getElementById('btn-new-chat').innerText = localization[currentLang].newChat;
        if (document.getElementById('history-label')) document.getElementById('history-label').innerText = localization[currentLang].history;
        if (typeof userInput !== 'undefined' && userInput) userInput.placeholder = localization[currentLang].placeholder;
    }

    // Update Layar Sambutan
    const welcomeEl = document.getElementById('welcome-screen');
    if (welcomeEl) {
        showWelcomeScreen(false);
    }

    const messageElements = document.querySelectorAll('.message .content');
    if (messageElements.length === 0) {
        isTranslating = false;
        if (langBtn) langBtn.innerText = currentLang === 'id' ? 'EN' : 'ID';
        return;
    }

    isTranslating = true;

    for (const el of messageElements) {
        if (el.querySelector('img')) continue;

        const parentMessage = el.closest('.message');
        let originalText = parentMessage?.dataset.raw;

        if (!originalText) {
            const clone = el.cloneNode(true);
            const existingCopyBtn = clone.querySelector('.copy-btn');
            if (existingCopyBtn) existingCopyBtn.remove();
            originalText = (clone.innerText || clone.textContent || '').trim();
        }

        if (!originalText) continue;

        // Mengubah 'const' menjadi 'let' agar string bisa dibersihkan
        let translatedText = await getTranslation(originalText, currentLang);

        // Hapus simbol '#' liar jika teks asli sebenarnya bukan heading
        if (!originalText.includes('#')) {
            translatedText = translatedText.replace(/^#+\s*/gm, '');
        }

        if (parentMessage) parentMessage.dataset.raw = translatedText;

        if (typeof marked !== 'undefined' && parentMessage && parentMessage.classList.contains('bot')) {
            el.innerHTML = marked.parse(translatedText);
        } else {
            el.innerText = translatedText;
        }

        // Update Tombol Salin
        if (parentMessage && parentMessage.classList.contains('bot')) {
            const oldCopyBtn = parentMessage.querySelector('.copy-btn');
            if (oldCopyBtn) oldCopyBtn.remove();

            const newEncodedText = encodeURIComponent(translatedText);
            const copyBtnHTML = `
                <button class="copy-btn" onclick="copyMessageText(this, '${newEncodedText}')">
                    <span class="material-icons-outlined" style="font-size: 12px;">content_copy</span> Salin
                </button>
            `;
            el.insertAdjacentHTML('beforeend', copyBtnHTML);
        }
    }

    isTranslating = false;
    if (langBtn) langBtn.innerText = currentLang === 'id' ? 'EN' : 'ID';
}

    function copyMessageText(buttonElement, encodedText) {
    const originalText = decodeURIComponent(encodedText);

    // Menggunakan Clipboard API modern untuk menyalin teks
    navigator.clipboard.writeText(originalText).then(() => {
        // Ubah tampilan tombol sementara jadi "Tersalin!" biar interaktif
        const originalHTML = buttonElement.innerHTML;
        buttonElement.innerHTML = `<span class="material-icons-outlined" style="font-size: 14px; color: #34a853;">done</span> Tersalin!`;
        buttonElement.style.borderColor = '#34a853';

        // Kembalikan ke bentuk semula setelah 2 detik
        setTimeout(() => {
            buttonElement.innerHTML = originalHTML;
            buttonElement.style.borderColor = '';
        }, 2000);
    }).catch(err => {
        console.error('Gagal menyalin teks: ', err);
        alert('Gagal menyalin teks ke clipboard.');
    });
}
